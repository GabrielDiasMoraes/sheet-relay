name: CI
on:
  push: { branches: [main] }
  pull_request:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: relay/package-lock.json }
      - run: npm ci --prefix relay
      - run: bash scripts/check.sh --rapido
      - run: node scripts/leak-scan.mjs
  app-typecheck:
    runs-on: ubuntu-latest
    strategy: { fail-fast: false, matrix: { system: [dnd5e, fallout, legends] } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: "systems/${{ matrix.system }}/app/package-lock.json" }
      - run: npm ci --no-audit --no-fund
        working-directory: systems/${{ matrix.system }}/app
      - run: node node_modules/typescript/bin/tsc --noEmit
        working-directory: systems/${{ matrix.system }}/app
